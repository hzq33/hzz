# Backend CI — lint + unit tests + RAG quality gates + dependency audit
name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'agent_server.py'
      - 'config.yaml'
      - 'requirements.txt'
      - '.coveragerc'
      - 'ruff.toml'
      - 'pytest.ini'
      - 'tests/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'agent_server.py'
      - 'config.yaml'
      - 'requirements.txt'
      - '.coveragerc'
      - 'ruff.toml'
      - 'pytest.ini'
      - 'tests/**'
      - '.github/workflows/python-ci.yml'

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Pytest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'ruff>=0.8.0' 'pip-audit>=2.7.0'

      - name: Ruff check
        run: |
          ruff check src agent_server.py

      - name: Run unit tests
        env:
          AGENT_API_TOKEN: ci-test-token-0123456789abcdef
          CORS_ORIGINS: http://localhost:3001
          DEEPSEEK_API_KEY: ci-placeholder-key
          EXECUTE_CODE_ENABLED: 'false'
          AGENT_TOOL_HITL: '1'
          NOVEL_RERANKER_PROVIDER: keyword
          CI: 'true'
        run: |
          python -m pytest -q --tb=short --cov=src --cov-report=term-missing --cov-fail-under=45

      - name: pip-audit (advisory)
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --progress-spinner off || true

      - name: Summarize
        if: always()
        run: |
          echo "## Python CI" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ruff check (E/F/I/W, ignore E501)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests via requirements.txt (merged single dependency file)." >> "$GITHUB_STEP_SUMMARY"
          echo "- HITL gate on for high-risk tools (AGENT_TOOL_HITL=1)." >> "$GITHUB_STEP_SUMMARY"
          echo "- Reranker forced to keyword in CI (see docs/RERANKER.md)." >> "$GITHUB_STEP_SUMMARY"
          echo "- pip-audit advisory (non-blocking)." >> "$GITHUB_STEP_SUMMARY"
